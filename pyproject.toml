[project]
name = "landmark-tools"
version = "0.0.0"
description = "Python reference prototype and evaluation harness for Landmark"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "librosa",
    "soundfile",
    "pandas",
    "matplotlib",
    "grpcio>=1.84.0",
    "protobuf>=7.36.2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["gen"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["prototype", "eval", "bench"]
pythonpath = [".", "gen/python"]
