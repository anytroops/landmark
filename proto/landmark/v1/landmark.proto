syntax = "proto3";

package landmark.v1;

option go_package = "github.com/anytroops/landmark/gen/landmark/v1;landmarkv1";

// Landmark is one (anchor, target) peak pair packed into a hash.
message Landmark {
  uint32 hash = 1;
  // Anchor frame index in the query.
  uint32 t = 2;
}

message Candidate {
  uint32 track_id = 1;
  // Max offset-histogram count.
  uint32 score = 2;
  // Best (t_db - t_query), in frames.
  int32 offset = 3;
}

message SearchRequest {
  repeated Landmark landmarks = 1;
  uint32 top_k = 2;
}

message SearchResponse {
  repeated Candidate candidates = 1;
  uint32 partition_id = 2;
  uint64 postings_scanned = 3;
}

service ShardService {
  rpc Search(SearchRequest) returns (SearchResponse);
}

message IdentifyRequest {
  repeated Landmark landmarks = 1;
  uint32 top_k = 2;
}

message IdentifyResponse {
  repeated Candidate candidates = 1;
  // Passed acceptance thresholds.
  bool matched = 2;
  bool partial = 3;
  uint32 partitions_responded = 4;
  uint32 partitions_total = 5;
}

service CoordinatorService {
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);
}
