syntax = "proto3";

package landmark.v1;

option go_package = "github.com/anytroops/landmark/gen/landmark/v1;landmarkv1";

message Candidate {
  uint32 track_id = 1;
  // Max offset-histogram count.
  uint32 score = 2;
  // Best (t_db - t_query), in frames. For a triplet index, the reference
  // frame at query frame 0 along the fitted line.
  int32 offset = 3;
  // Triplet index (D33): fitted tempo factor, reference time per query time
  // (> 1: the query plays faster). 0 for a pair index.
  float scale = 4;
}

// Query landmarks travel as parallel packed arrays: (hashes[i], times[i]) is
// one landmark, times[i] its anchor frame in the query. Packed arrays decode
// into two slices instead of one message object per landmark (D28).
message SearchRequest {
  reserved 1;
  reserved "landmarks";
  uint32 top_k = 2;
  repeated fixed32 hashes = 3;
  repeated uint32 times = 4;
  // Triplet landmarks (D31 B2, D33) also carry, one byte per landmark, the
  // span t_k - t_i and the anchor band. Empty for pair landmarks.
  bytes spans = 5;
  bytes bands = 6;
  // Index version to search (D42); 0: whichever the shard serves now. A
  // shard that no longer holds the version answers FAILED_PRECONDITION.
  uint64 manifest_version = 7;
}

message SearchResponse {
  repeated Candidate candidates = 1;
  uint32 partition_id = 2;
  uint64 postings_scanned = 3;
  // The index version that answered.
  uint64 manifest_version = 4;
}

// ServedVersion is an index version a shard can search, and its content
// checksum for this partition (D26, D42).
message ServedVersion {
  uint64 version = 1;
  fixed32 checksum = 2;
}

message InfoRequest {}

// InfoResponse identifies the segment a shard serves, so the coordinator can
// refuse replicas whose index differs from the cluster's (D26).
message InfoResponse {
  uint32 partition_id = 1;
  uint32 n_partitions = 2;
  uint32 n_tracks = 3;
  uint64 n_keys = 4;
  uint64 n_postings = 5;
  // CRC-32C footer of the segment file: its content identity.
  fixed32 segment_crc32c = 6;
  uint32 format_version = 7;
  // Versions this shard can search, newest first: the current one and,
  // while its searches drain, the one before (D42). segment_crc32c is the
  // current version's checksum.
  repeated ServedVersion versions = 8;
}

service ShardService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Info(InfoRequest) returns (InfoResponse);
}

message IdentifyRequest {
  reserved 1;
  reserved "landmarks";
  uint32 top_k = 2;
  repeated fixed32 hashes = 3; // see SearchRequest
  repeated uint32 times = 4;
  bytes spans = 5;
  bytes bands = 6;
}

message IdentifyResponse {
  repeated Candidate candidates = 1;
  // Passed acceptance thresholds.
  bool matched = 2;
  bool partial = 3;
  uint32 partitions_responded = 4;
  uint32 partitions_total = 5;
  // The index version every partition answered from (D42): read track ids
  // with that version's catalog.
  uint64 index_version = 6;
}

service CoordinatorService {
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);
}
