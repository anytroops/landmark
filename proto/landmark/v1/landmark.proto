syntax = "proto3";

package landmark.v1;

option go_package = "github.com/anytroops/landmark/gen/landmark/v1;landmarkv1";

message Candidate {
  uint32 track_id = 1;
  // Max offset-histogram count.
  uint32 score = 2;
  // Best (t_db - t_query), in frames.
  int32 offset = 3;
}

// Query landmarks travel as parallel packed arrays: (hashes[i], times[i]) is
// one landmark, times[i] its anchor frame in the query. Packed arrays decode
// into two slices instead of one message object per landmark (D28).
message SearchRequest {
  reserved 1;
  reserved "landmarks";
  uint32 top_k = 2;
  repeated fixed32 hashes = 3;
  repeated uint32 times = 4;
}

message SearchResponse {
  repeated Candidate candidates = 1;
  uint32 partition_id = 2;
  uint64 postings_scanned = 3;
}

message InfoRequest {}

// InfoResponse identifies the segment a shard serves, so the coordinator can
// refuse replicas whose index differs from the cluster's (D26).
message InfoResponse {
  uint32 partition_id = 1;
  uint32 n_partitions = 2;
  uint32 n_tracks = 3;
  uint64 n_keys = 4;
  uint64 n_postings = 5;
  // CRC-32C footer of the segment file: its content identity.
  fixed32 segment_crc32c = 6;
  uint32 format_version = 7;
}

service ShardService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc Info(InfoRequest) returns (InfoResponse);
}

message IdentifyRequest {
  reserved 1;
  reserved "landmarks";
  uint32 top_k = 2;
  repeated fixed32 hashes = 3; // see SearchRequest
  repeated uint32 times = 4;
}

message IdentifyResponse {
  repeated Candidate candidates = 1;
  // Passed acceptance thresholds.
  bool matched = 2;
  bool partial = 3;
  uint32 partitions_responded = 4;
  uint32 partitions_total = 5;
}

service CoordinatorService {
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);
}
